<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RACING</title>
    <meta name="description" content="A low-poly time trial: pick a car, set the fastest lap." />
    <meta name="theme-color" content="#d0142f" />
    <!-- The logo's three slashes on the game's red (public/favicon.svg; the PNGs are renders of it). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The loading screen's colour from the very first paint, before any styles load. -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- The loading screen, all lights off, until the game's code takes over (src/ui/Loading.tsx draws the same; vite.config.ts fills in the gantry). -->
      <div class="loading" aria-busy="true">
        <div class="loading-inner">
          <div class="gantry"><!-- gantry --></div>
          <div class="loading-line"><div class="loading-line-fill"></div></div>
          <p class="loading-status">Loading</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
